# Builds ZapFast's latest release plus the open pull requests of the
# authors below for macOS and Windows, and publishes it as a signed release
# of this fork, which the app's own updater offers. It runs on a schedule
# and does nothing when neither the upstream release nor any of those pull
# requests changed since the last complete build.
name: Personal build

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: false

env:
  UPSTREAM: crmne/zapfast
  AUTHORS: thize guibg

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      # Keep the fork's main equal to upstream. GITHUB_TOKEN cannot push
      # commits that touch workflow files, so this needs SYNC_TOKEN (a token
      # with the workflow scope) whenever upstream changes one of them.
      - name: Sync fork main with upstream
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          : > prs.tsv
          for author in $AUTHORS; do
            gh pr list -R "$UPSTREAM" --state open --author "$author" --limit 100 \
              --json number,headRefOid,title,author \
              --jq '.[] | [.number, .headRefOid, .author.login, .title] | @tsv' >> prs.tsv
          done
          sort -n -o prs.tsv prs.tsv
          fingerprint=$( { echo "$upstream_tag"; cut -f1,2 prs.tsv; } | sha256sum | cut -c1-12)
          version="${upstream_tag#v}-personal.${GITHUB_RUN_NUMBER}"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          last=$(gh release view -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if grep -q "fingerprint: $fingerprint" <<<"$last" && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the last build ($fingerprint)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          cat prs.tsv

      - name: Check out this branch
        if: steps.plan.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          path: personal

      - name: Check out upstream release
        if: steps.plan.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.plan.outputs.upstream_tag }}
          fetch-depth: 0
          path: zapfast

      - name: Merge the open pull requests
        if: steps.plan.outputs.build == 'true'
        working-directory: zapfast
        run: |
          set -euo pipefail
          git config user.name "personal-build"
          git config user.email "personal-build@users.noreply.github.com"
          {
            echo "ZapFast ${{ steps.plan.outputs.upstream_tag }} with these open pull requests from $UPSTREAM:"
            echo
          } > ../notes.md
          skipped=""
          while IFS=$'\t' read -r number sha author title; do
            [ -n "$number" ] || continue
            git fetch -q origin "pull/$number/head:pr-$number"
            if git merge -q --no-edit "pr-$number"; then
              echo "- #$number $title (@$author)" >> ../notes.md
            else
              git merge --abort
              skipped="$skipped\n- #$number $title (@$author)"
            fi
          done < ../prs.tsv
          if [ -n "$skipped" ]; then
            printf '\nLeft out because they conflict with this release:\n%b\n' "$skipped" >> ../notes.md
          fi
          cat ../notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Point the updater at this fork
        if: steps.plan.outputs.build == 'true'
        working-directory: zapfast
        run: |
          bash ../personal/patch-updater.sh "${{ steps.plan.outputs.version }}" ../personal/update-public-key.hex
          git commit -qam "Personal build ${{ steps.plan.outputs.version }}"
          git archive --format=tar.gz -o ../source.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: source
          path: |
            source.tar.gz
            notes.md
          retention-days: 3

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # GitHub's Apple silicon runners are often out of capacity; the Intel
    # ones build the Apple silicon binary just as well, cross-compiled.
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - run: mkdir zapfast && tar xzf source.tar.gz -C zapfast
      - name: Rust target
        working-directory: zapfast
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zapfast
      - name: Build
        working-directory: zapfast
        run: cargo build --locked --release --target "$TARGET"
      - name: Disk image
        working-directory: zapfast
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          lipo -archs "target/$TARGET/release/zapfast" | grep -qx arm64
          bash packaging/macos/bundle.sh "target/$TARGET/release/zapfast" dmg-root/ZapFast.app "$VERSION"
          # Sign with the same self-made certificate as every personal build,
          # so the Keychain keeps trusting ZapFast across updates. An ad-hoc
          # signature changes with every build and asks for the password.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --keychain "$keychain" --entitlements packaging/macos/entitlements.plist \
            --sign "ZapFast Assinatura" dmg-root/ZapFast.app
          codesign --verify --strict dmg-root/ZapFast.app
          codesign -dr - dmg-root/ZapFast.app
          ln -s /Applications dmg-root/Applications
          mkdir -p ../dist
          hdiutil create -volname ZapFast -srcfolder dmg-root -fs HFS+ -format UDZO \
            -o "../dist/zapfast-v$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - shell: bash
        run: mkdir zapfast && tar xzf source.tar.gz -C zapfast
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zapfast
      # PowerShell, as upstream builds: vendored OpenSSL needs the runner's
      # Strawberry Perl, and Git Bash's Perl cannot configure it.
      - name: Build
        working-directory: zapfast
        run: cargo build --locked --release --target $env:TARGET
      # A portable copy, as upstream ships it: the marker beside the
      # executable lets it update itself and keep its data beside it.
      - name: Package
        working-directory: zapfast
        shell: bash
        run: |
          set -euo pipefail
          test "$(target/$TARGET/release/zapfast.exe --version | tr -d '\r')" = "zapfast $VERSION"
          name="zapfast-v$VERSION-$TARGET"
          mkdir -p "../dist/$name"
          cp "target/$TARGET/release/zapfast.exe" README.md LICENSE THIRD-PARTY-NOTICES.md \
            packaging/zapfast-portable.txt "../dist/$name/"
          cd ../dist
          7z a "$name.zip" "$name" >/dev/null
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [plan, macos, windows]
    if: >-
      always() && needs.plan.outputs.build == 'true' &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: personal
      - uses: actions/download-artifact@v4
        with:
          name: source
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
        with:
          directory: dist
          public-key: personal/update-public-key.hex
          key-env: UPDATE_SIGNING_KEY
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a build with both platforms counts as done; a partial one
          # is built again at the next scheduled run.
          if [ "${{ needs.macos.result }}" = success ] && [ "${{ needs.windows.result }}" = success ]; then
            printf '\n<!-- fingerprint: %s -->\n' "${{ needs.plan.outputs.fingerprint }}" >> notes.md
          else
            printf '\nOnly part of this build finished (macOS: %s, Windows: %s).\n' \
              "${{ needs.macos.result }}" "${{ needs.windows.result }}" >> notes.md
          fi
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" \
            --target personal --latest \
            --title "ZapFast $VERSION (${{ needs.plan.outputs.upstream_tag }} + PRs)" \
            --notes-file notes.md
          # Keep the five newest personal builds.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-personal\\."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
            done
